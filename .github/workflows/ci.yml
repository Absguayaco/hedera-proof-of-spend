name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.2'

      # This repo requires npm >= 11.10.0; below that the min-release-age
      # cooldown in .npmrc is ignored silently. setup-node ships npm 10.x.
      - run: npm install -g npm@11.10.0

      - run: npm ci
      - run: npm run typecheck
      - run: npm test --if-present

      # The README claims the verifier depends on nothing of ours. A claim a
      # human has to remember to check eventually stops being true.
      - name: verifier depends on nothing of ours
        run: node scripts/check-verifier-independence.mjs
