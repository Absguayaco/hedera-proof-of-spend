name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11.19.0, which is above the 11.10.0 floor where
      # min-release-age in .npmrc is actually enforced — so no npm upgrade
      # step is needed here, and none should be added.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci
      - run: npm run typecheck
      - run: npm test --if-present

      # The README claims the verifier depends on nothing of ours. A claim a
      # human has to remember to check eventually stops being true.
      - name: verifier depends on nothing of ours
        run: node scripts/check-verifier-independence.mjs

      # api/index.js is a committed build artifact, so that Vercel needs no
      # build step. Committed output can drift from its source silently, so the
      # build runs here and the result must match what is checked in.
      - name: the committed vercel bundle is current
        run: |
          npm run build
          git diff --exit-code -- api/index.js || {
            echo "api/index.js is stale. Run 'npm run build' and commit the result."
            exit 1
          }
